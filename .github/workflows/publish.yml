name: Publish

# Tagging is the release action: `git tag v1.3.4 && git push origin v1.3.4`.
# Nothing is published from a branch push, and a tag that disagrees with
# package.json fails before the registry is touched.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # provenance attestation (works with either auth path)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: it writes an .npmrc pointing at _authToken, and this
      # job decides per-run whether a token exists at all. The .npmrc is written
      # below only when it is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1 and `npm stage` needs >= 11.15; the
      # CLI bundled with Node 22 is older than both. Pinned to the major rather than
      # `@latest` so a release does not change npm out from under itself.
      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $version — bump the version, or retag."
            exit 1
          fi

      # The registry should never receive an artifact the suite did not pass.
      - name: Test
        run: npm test

      - name: Verify the published tarball contents
        run: npm run check:pack

      # Diagnostics only. Which credential npm uses is not ours to pick: when the
      # package has a trusted publisher configured, npm authenticates with OIDC
      # and ignores an .npmrc token, even one `npm whoami` accepts. This reports
      # what is available so a failure is readable, and never branches on it.
      - name: Report the available credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version), node $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC request URL: available"
          else
            echo "OIDC request URL: missing"
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            # npm reads a token only through an .npmrc, so write one to look it up.
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            set +e
            who="$(npm whoami 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "NPM_TOKEN: accepted by the registry as $who"
              echo "Note: a configured trusted publisher still takes precedence over this token."
            else
              echo "::warning::NPM_TOKEN is present but rejected: $who"
            fi
          else
            echo "NPM_TOKEN: absent; only OIDC is available."
          fi

      - name: Is this version already on npm?
        id: probe
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # A direct publish is attempted once. The only refusal this recovers from is
      # `OIDC permission denied for this action`, which means the trusted publisher
      # allows `npm stage publish` but not `npm publish` — a one-click 2FA approval
      # then makes it live. Any other error fails the release.
      #
      # The logic lives in scripts/publish.sh so test/publish-workflow.test.sh can
      # drive it against a fake npm instead of only in a real release.
      - name: Publish to npm
        id: publish
        if: steps.probe.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/publish.sh

      - name: Explain what happened
        if: steps.publish.outputs.mode != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### npm publish: ${{ steps.publish.outputs.mode }}"
            echo
            if [ "${{ steps.publish.outputs.mode }}" = "published" ]; then
              echo "\`dsh-running-sessions@$version\` is live on npm."
            else
              echo "\`dsh-running-sessions@$version\` is **staged**, not live yet."
              echo
              echo "Approve it with one 2FA click: https://www.npmjs.com/package/dsh-running-sessions?activeTab=versions"
              echo
              echo "Or from a machine that is logged in and has npm >= 11.15 — the id comes from \`npm stage list\`:"
              echo
              echo '```sh'
              echo "npm stage list dsh-running-sessions"
              echo "npm stage approve <stage-id>"
              echo '```'
              echo
              echo "To publish directly in future, either tick **npm publish** under"
              echo "Settings → Trusted publishing → Allowed actions, or keep \`NPM_TOKEN\` set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A version-free asset name keeps
      # https://github.com/.../releases/latest/download/dsh-running-sessions.tgz
      # working across releases; a versioned name would 404 the day the next
      # release is cut. Packed and re-uploaded on every run, so a re-run can finish
      # a release whose publish step already succeeded.
      - name: Pack a tarball for the GitHub Release
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz release/dsh-running-sessions.tgz

      - name: Create or refresh the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/dsh-running-sessions.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release/dsh-running-sessions.tgz
          fi
