name: Publish

# Tagging is the release action: `git tag v1.3.1 && git push origin v1.3.1`.
# Nothing is published from a branch push, and a tag that disagrees with
# package.json fails before the registry is touched.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it writes an .npmrc with an empty _authToken, which
          # makes npm look for a token instead of doing the OIDC exchange.

      # Trusted publishing needs npm 11.5.1+; the CLI bundled with Node 22 is
      # older than that and would fall back to looking for a token. Pinned to the
      # major rather than `@latest` so a release does not change npm out from under
      # itself — npm 12 already reshaped `pack --json`, which `check:pack` handles.
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $version — bump the version, or retag."
            exit 1
          fi

      # The registry should never receive an artifact the suite did not pass.
      - name: Test
        run: npm test

      - name: Verify the published tarball contents
        run: npm run check:pack

      # Distinguishes the two ways trusted publishing can fail: no OIDC token in
      # this job at all, versus a token the registry has no trusted relationship
      # for (which surfaces as ENEEDAUTH from `npm publish`).
      - name: Report the publishing identity
        run: |
          echo "npm $(npm --version), node $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC request URL: available"
          else
            echo "::error::OIDC request URL is missing — id-token: write did not reach this job"
            exit 1
          fi

      - name: Is this version already on npm?
        id: probe
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN on purpose: trusted publishing does the OIDC exchange,
      # so the job publishes as this repository rather than as a long-lived secret.
      # Configure it at npmjs.com → package → Settings → Trusted publishing, with
      # repository ERroooooR/dsh-running-sessions and workflow filename publish.yml.
      #
      # A trusted publisher created after 2026-09-03 allows only `npm stage
      # publish` until the maintainer ticks "npm publish" on that entry. Both are
      # handled here: publish directly when allowed, otherwise stage the version so
      # a maintainer can approve it with one 2FA click. Staging is not a failure —
      # the artifact is built and signed either way.
      - name: Publish to npm
        id: publish
        if: steps.probe.outputs.skip != 'true'
        run: |
          set +e
          direct="$(npm publish --access public --provenance 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$direct"

          if [ "$status" -eq 0 ]; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only this exact refusal means "the trusted publisher is stage-only".
          # Anything else is a real error and must not be papered over.
          if ! printf '%s' "$direct" | grep -q 'OIDC permission denied for this action'; then
            exit "$status"
          fi

          echo "::notice::This trusted publisher allows staged publishing only; staging $version for approval."
          staged="$(npm stage publish --access public --provenance 2>&1)" || {
            # Re-running a tag must not fail merely because the version is already
            # sitting in the staging area.
            if printf '%s' "$staged" | grep -qi 'already'; then
              printf '%s\n' "$staged"
              echo "mode=staged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$staged" >&2
            exit 1
          }
          printf '%s\n' "$staged"
          echo "mode=staged" >> "$GITHUB_OUTPUT"

      - name: Explain what happened
        if: steps.publish.outputs.mode != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### npm publish: ${{ steps.publish.outputs.mode }}"
            echo
            if [ "${{ steps.publish.outputs.mode }}" = "published" ]; then
              echo "\`dsh-running-sessions@$version\` is live on npm."
            else
              echo "\`dsh-running-sessions@$version\` is **staged**, not live yet."
              echo
              echo "Approve it with one 2FA click: https://www.npmjs.com/package/dsh-running-sessions?activeTab=versions"
              echo
              echo "Or from a machine that is logged in and has npm >= 11.15 — the id comes from \`npm stage list\`:"
              echo
              echo '```sh'
              echo "npm stage list dsh-running-sessions   # prints the staged version and its stage id"
              echo "npm stage approve <stage-id>"
              echo '```'
              echo
              echo "To make future releases publish directly, tick **npm publish** under"
              echo "Settings → Trusted publishing → Allowed actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A version-free asset name keeps
      # https://github.com/.../releases/latest/download/dsh-running-sessions.tgz
      # working across releases; a versioned name would 404 the day the next
      # release is cut. Packed before the registry is touched, and re-packed on
      # every run: if the publish succeeds and a later step fails, a re-run has to
      # be able to finish the release instead of skipping past it.
      - name: Pack a tarball for the GitHub Release
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz release/dsh-running-sessions.tgz

      # The GitHub Release is reconciled on every run, including one where npm was
      # already updated by a previous attempt.
      - name: Create or refresh the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/dsh-running-sessions.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release/dsh-running-sessions.tgz
          fi
