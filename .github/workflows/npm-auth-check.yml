name: npm auth check

# Read-only diagnostic. Reports what npm and the registry think of this
# repository's publishing credentials; creates, stages and publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use the same npm as the release workflow
        run: npm install --global npm@11

      - name: Tool and OIDC availability
        run: |
          echo "npm $(npm --version), node $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC request URL: available"
          else
            echo "OIDC request URL: MISSING"
          fi
          echo "manifest: $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

      # npm only reads NODE_AUTH_TOKEN through an .npmrc, so the check needs one.
      - name: What the repository secret is allowed to do
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN: empty or absent"
            exit 0
          fi
          echo "NPM_TOKEN: present (${#NPM_TOKEN} chars), prefix '${NPM_TOKEN:0:4}…'"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"

          probe() {
            set +e
            local out
            out="$("$@" 2>&1)"
            local status=$?
            set -e
            echo "--- npm $* (exit $status)"
            printf '%s\n' "$out" | head -25
          }

          probe npm whoami
          probe npm access list packages
          probe npm trust list dsh-running-sessions --json

      # --dry-run: describes the relationship npm would create without touching it.
      - name: Trust relationship, as npm sees it
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          set +e
          npm trust github dsh-running-sessions \
            --file publish.yml \
            --repository ERroooooR/dsh-running-sessions \
            --dry-run --json 2>&1 | head -40
          echo "(dry-run exit above)"
          set -e

      - name: Registry state of this package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "manifest version: $version"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "manifest version: already published"
          else
            echo "manifest version: not published"
          fi
          echo "published versions: $(npm view "$name" versions --json 2>/dev/null | tr -d '\n ')"
          echo "dist-tags: $(npm view "$name" dist-tags --json 2>/dev/null | tr -d '\n ')"
